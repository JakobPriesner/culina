# The installed apps to the stores' test tracks (docs/native-app-design.md, 5.4): TestFlight and Google Play's internal
# track. Only after the server's own release passed its gate (release.yml: the tag is on main and CI is green), from
# the same commit. Promotion to the public stores stays a person's decision in App Store Connect and the Play Console.
#
# Signing material lives only in the `app-stores` environment, which requires a reviewer before a job sees it:
#   ANDROID_UPLOAD_KEYSTORE (base64 .jks), ANDROID_UPLOAD_KEYSTORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS,
#   ANDROID_UPLOAD_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON,
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY (base64 .p8), APPLE_TEAM_ID.
#
# Off until the repository variable STORE_RELEASES is 'true', set once that environment and its secrets exist.
# Without it every release would end in a red run here, and the first one would create `app-stores` with no reviewer.
#
# Actions are pinned to a commit, as everywhere.

name: Native release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: native-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_PACKAGE_JSON: 'src/frontend/package.json'

jobs:
  android:
    name: Android to the internal track
    if: vars.STORE_RELEASES == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: app-stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      # The publisher's push relay (deploy/relay), a repository variable; unset, the app offers no import notifications.
      - run: pnpm build:native && pnpm exec cap sync android
        working-directory: src/frontend
        env:
          CULINA_RELAY_URL: ${{ vars.CULINA_RELAY_URL }}

      # FCM's project file, which is not committed: without it the Gradle build leaves Firebase (and push) out.
      - name: Firebase project file
        working-directory: src/frontend/native/android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json; fi

      # The version shown in the store is the tag; the store's build number only has to grow, which the run number does.
      - name: Signed bundle
        working-directory: src/frontend/native/android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          CULINA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          CULINA_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          CULINA_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          CULINA_VERSION_CODE: ${{ github.run_number }}
          CULINA_VERSION_NAME: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          export CULINA_ANDROID_KEYSTORE="$RUNNER_TEMP/upload.jks"
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 --decode > "$CULINA_ANDROID_KEYSTORE"
          ./gradlew --no-daemon bundleRelease
          rm -f "$CULINA_ANDROID_KEYSTORE"

      - uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.culina
          releaseFiles: src/frontend/native/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  ios:
    name: iOS to TestFlight
    if: vars.STORE_RELEASES == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: macos-26
    timeout-minutes: 60
    environment: app-stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      - run: pnpm build:native && pnpm exec cap sync ios
        working-directory: src/frontend
        env:
          CULINA_RELAY_URL: ${{ vars.CULINA_RELAY_URL }}

      # Automatic signing with an App Store Connect API key: Xcode fetches the certificates and profiles it needs
      # (the app, the CulinaTimerWidget extension) and the export uploads straight to App Store Connect.
      - name: Archive and upload
        working-directory: src/frontend/native/ios/App
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APP_STORE_CONNECT_KEY" | base64 --decode > "$KEY_PATH"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")

          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Culina.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${VERSION#v}" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${AUTH[@]}" archive

          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Culina.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}"

          rm -f "$KEY_PATH"
