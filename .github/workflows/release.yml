# A tag is the only thing that publishes. Nothing here runs on a branch.
#
# What comes out is an image for both architectures anybody self-hosts on, an
# SBOM, and signatures for both — so someone pulling `ghcr.io/.../culina` can
# prove it came from this repository and this commit, without trusting the
# registry.
#
# A tag is a claim anybody with push access can make about any commit, so it is
# checked before anything is built: the commit must already be on main, and CI
# must have passed on it. And no tag moves until the image behind it has been
# scanned, signed and attested — the build goes up by digest only, and `latest`
# is the last thing to change rather than the first.

name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # The gates the `edge` image waits for, reused rather than repeated: CI's run
  # for this exact commit on main. A tag on a commit that is red, still running,
  # or never merged publishes nothing. Re-run this workflow once CI is green —
  # the tag does not have to be pushed again.
  gate:
    name: On main, and CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the history, to find main
      actions: read # CI's runs for the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tagged commit is on main and CI passed on it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An annotated tag is an object of its own; what CI ran on is the
          # commit it points at.
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at ${commit}, which is not on main. Merge it, then tag the merged commit."
            exit 1
          fi
          passed=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$commit" -f branch=main -f event=push -f status=success \
            --jq '.total_count')
          if [ "$passed" -eq 0 ]; then
            echo "::error::CI has not passed on ${commit}. Once it has, re-run this workflow."
            exit 1
          fi

  publish:
    name: Publish
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # the release notes
      packages: write # the image
      id-token: write # keyless signing, and provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes are written from what changed since the previous tag.
          fetch-depth: 0

      # A registry reference must be lowercase, and `github.repository` keeps
      # the case the repository was named with — `JakobPriesner/culina` does
      # not parse. The metadata action folds it for the push on its own; every
      # step after the push that names the image does not.
      - name: Image name
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # arm64 matters: a great many self-hosted instances are a Raspberry Pi or
      # an ARM VPS, and an amd64-only image simply does not run there.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # Pushed by digest and nothing else: the registry holds the image, but no
      # tag anybody pulls points at it yet. The tags come last, once it has
      # passed the scan.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=${{ github.ref_name }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # A last look at what is about to be recommended to people. The same scan
      # as CI, against the pushed image rather than a local build — and before
      # any tag points at it, so a finding here fails the job with `latest`
      # still on the previous release.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: culina-sbom.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signature is tied to this workflow in this repository via
      # OIDC, so there is no signing key for anyone to steal or for the
      # maintainer to lose.
      - name: Sign the image and its SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE}@${DIGEST}"
          cosign attest --yes \
            --predicate culina-sbom.spdx.json \
            --type spdxjson \
            "${REGISTRY}/${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Only now does anything people pull move. Given one source, imagetools
      # copies the index as it is, so every tag resolves to the digest that was
      # scanned and signed above.
      - name: Tag the scanned image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${REGISTRY}/${IMAGE}@${DIGEST}"

      # The release points to the exact image built and signed above. Its
      # change list comes from commits since the previous tag.
      - name: Release notes
        id: notes
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## What changed"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='- %s'
            fi
            echo
            echo "## Container image"
            echo
            echo "[View in GitHub Packages](https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${IMAGE#*/})"
            echo
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE}:${GITHUB_REF_NAME}"
            echo "docker pull ${REGISTRY}/${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "## Verifying this image"
            echo
            echo '```bash'
            echo "cosign verify ${REGISTRY}/${IMAGE}:${GITHUB_REF_NAME} \\"
            # The signing identity keeps the repository's own case, unlike the
            # image reference above.
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > notes.md

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: notes.md
          files: culina-sbom.spdx.json
          # A tag with a suffix — v1.2.0-rc1 — is a pre-release, and `latest`
          # above already refuses to move for one.
          prerelease: ${{ contains(github.ref_name, '-') }}
