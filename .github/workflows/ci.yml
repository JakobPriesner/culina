# Every job here is a merge gate. None of them is advisory.
#
# Actions are pinned to a commit, never a tag: a tag is a name its owner can
# move, and an action that moves is an action that runs code nobody reviewed
# with a token that can write to this repository.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A superseded run is wasted compute and a confusing status. The newest push to
# a branch is the only one whose answer anyone acts on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place, so a bump is one edit rather than a hunt through the file.
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22'
  # pnpm's version lives in `packageManager` in the frontend's package.json.
  # There is none at the repository root, and every `pnpm/action-setup` here has
  # to be pointed at that file or it fails with no version to install.
  PNPM_PACKAGE_JSON: 'src/frontend/package.json'
  # Nothing here is an interactive session, and the telemetry notice is noise
  # in every log.
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: src/backend/**/packages.lock.json

      # Locked: the build that runs here restores exactly what was tested
      # locally, or it fails saying so.
      - run: dotnet restore --locked-mode
        working-directory: src/backend

      - run: dotnet format --verify-no-changes
        working-directory: src/backend

      # Warnings are already errors in Directory.Build.props, so this is also
      # the lint step. There is no separate one to forget.
      - run: dotnet build --no-restore
        working-directory: src/backend

      - name: Unit and architecture tests
        working-directory: src/backend
        run: |
          dotnet test tests/Domain.UnitTests --no-build
          dotnet test tests/Application.UnitTests --no-build
          dotnet test tests/ArchitectureTests --no-build

      # Testcontainers starts a real PostgreSQL. Slower and worth it: the SQL is
      # hand-written, and a fake would only prove the fake works.
      - name: Integration tests
        working-directory: src/backend
        run: dotnet test tests/IntegrationTests --no-build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      - run: pnpm lint
        working-directory: src/frontend

      # svelte-check plus the service worker's own tsconfig — the app's config
      # excludes the worker, and an unchecked worker has shipped a bug before.
      - run: pnpm check
        working-directory: src/frontend

      - run: pnpm test:unit
        working-directory: src/frontend

      - run: pnpm build
        working-directory: src/frontend

      # A plain build, with no gallery flag — which is what a release is. The
      # gallery has shipped twice, both times invisibly, so what ships is
      # searched for text that exists nowhere else.
      - run: pnpm verify:release
        working-directory: src/frontend

      # What the app weighs, printed every run and failing when it grows past
      # what was agreed. The way this gets worse is never a decision anybody
      # made — it is one convenient dependency that brings a date library.
      - run: pnpm verify:budget
        working-directory: src/frontend

  contract:
    name: Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job that matters most. The backend and the generated client cannot
    # drift, because drift fails the build — without this, a renamed field is a
    # runtime surprise weeks later, in somebody's kitchen.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: culina
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: src/backend/**/packages.lock.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      # A service container runs no init scripts, so the three extensions that
      # scripts/db-init.sh creates everywhere else have to be created here.
      # Without them the first migration fails on `type "citext" does not exist`
      # and the contract is never exported at all.
      - name: The extensions the migrations expect
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d culina -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS citext' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' \
            -c 'CREATE EXTENSION IF NOT EXISTS unaccent'

      # The document is produced by enumerating the endpoints of a *started*
      # host, which is why this job needs a database at all.
      - name: Export the OpenAPI document
        working-directory: src/backend
        env:
          Database__Host: localhost
          Database__Port: '5432'
          Database__Name: culina
          Database__Username: postgres
          Database__Password: postgres
          Database__RequireSsl: 'false'
        run: dotnet run --project src/Api -- --export-openapi

      - run: pnpm generate:api
        working-directory: src/frontend

      - name: The contract and the client must agree
        run: |
          if ! git diff --exit-code; then
            echo "::error::The OpenAPI document or the generated client is stale. Run 'make api' and commit the result."
            exit 1
          fi

  e2e:
    name: End to end
    # The one job that runs at home. It is also the one that most wants to: six
    # browsers against a real stack is the slowest thing in this file, and that
    # machine is sitting there anyway. Everything else stays hosted, where a
    # clean disk on every run is worth more than the minutes it costs.
    #
    # `homeserver` is that runner's own label. A hosted runner is destroyed
    # after the job and forgives whatever was left running; this one is not,
    # which is what the two teardown steps below are for.
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 30
    env:
      # Compose reads all three by name, so every `docker compose` below is the
      # bare verb and the teardown cannot drift from what was started.
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      # A project name of its own, so the teardown names exactly what this job
      # started and nothing else that machine happens to be running.
      COMPOSE_PROJECT_NAME: culina-e2e
      # Not 8080. This publishes onto a host shared with whatever else lives on
      # that machine, and 8080 is the port everything else wanted too.
      CULINA_PORT: '18080'
      # compose.prod.yaml refuses to be read at all without this — including by
      # `down`, which is why it is here and not on the step that starts the
      # stack.
      Database__Password: culina_ci_password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A run cancelled between `up` and the teardown leaves a stack holding
      # the port and — worse — a database with the administrator already in it,
      # which would fail the account step below on every run after it. The
      # hosted runners never needed this because the whole machine went away.
      - name: Clear anything a previous run left behind
        run: docker compose down --volumes --remove-orphans || true

      # `standalone` because this runner is not a hosted one. The usual
      # installer is a Node script, and it runs before setup-node has put a
      # modern Node on the path — so it gets whatever the runner image has,
      # which here is old enough that `require('node:path')` fails and the
      # install ends at "self-installer exits with code 1". A standalone pnpm
      # is a single binary and needs no Node at all to arrive.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}
          standalone: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      # Playwright refuses to install a browser on a distribution it does not
      # support, and says so plainly. The runner must be on Ubuntu 22.04 or
      # 24.04 — on 20.04 this step ends at "Playwright does not support
      # chromium on ubuntu20.04-x64" and nothing after it can run.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: src/frontend

      # The real image against a real database, so the suite exercises what
      # ships rather than a development arrangement that resembles it.
      - name: Start the stack
        # The suite gives every flow its own account and every request arrives
        # from one address, so the rate limits are doing their job when they
        # refuse it. This instance exists to be signed into; the limits
        # themselves have their own tests.
        env:
          RateLimits__LoginPerIpPerMinute: '1000'
          RateLimits__RegisterPerIpPerHour: '1000'
          # Six browsers driving one instance is a burst no person produces.
          RateLimits__RequestsPerSessionPerMinute: '20000'
          ForwardedHeaders__KnownNetworks: 172.16.0.0/12
        run: |
          docker build -t culina:ci --build-arg REVISION="${GITHUB_SHA::7}" .
          CULINA_IMAGE=culina:ci docker compose up -d --wait

      # A hosted runner and the stack it starts share one network stack, so
      # `localhost` is always the answer there. This runner is itself a
      # container, and whether localhost reaches a sibling depends entirely on
      # how that container was started — so ask instead of assuming, and fall
      # back to the address the stack actually has.
      - name: Where the stack answers from here
        id: stack
        run: |
          ready() { curl --fail --silent --max-time 5 "$1/health/ready" >/dev/null; }

          base="http://localhost:${CULINA_PORT}"

          if ! ready "$base"; then
            address=$(docker compose ps --quiet app \
              | xargs --no-run-if-empty docker inspect \
                  --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')
            base="http://${address}:8080"

            if [ -z "$address" ] || ! ready "$base"; then
              echo "::error::The stack is healthy but nothing on this runner can reach it: neither localhost:${CULINA_PORT} nor the container's own address answered /health/ready. The runner container needs host networking, or a route to the compose network."
              exit 1
            fi
          fi

          echo "Reached the stack at ${base}."
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      # The signed-in suites need an account, and the first account on a fresh
      # instance is always the administrator. Origin has to match the address
      # actually used, because the server checks that the two agree.
      - name: Create the first account
        env:
          BASE: ${{ steps.stack.outputs.base }}
        run: |
          curl --fail --silent --show-error \
            -X POST "${BASE}/api/v1/users" \
            -H 'Content-Type: application/json' \
            -H "Origin: ${BASE}" \
            -d '{"email":"ci@culina.test","displayName":"CI","password":"a sentence nobody else would pick"}'

      - name: Playwright
        working-directory: src/frontend
        env:
          CULINA_API: ${{ steps.stack.outputs.base }}
          CULINA_E2E_EMAIL: ci@culina.test
          CULINA_E2E_PASSWORD: a sentence nobody else would pick
        run: pnpm test:e2e

      # Only on failure: a passing run's trace is never opened, and uploading
      # it on every run is minutes of everyone's time for nothing.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report/
            src/frontend/test-results/
          retention-days: 7

      # Before the teardown, or there would be nothing left to ask.
      - name: What the container said
        if: failure()
        run: docker compose logs --no-color

      # Always, cancellation included. Every service is `restart:
      # unless-stopped`, so a stack left behind is a Culina instance running on
      # somebody's home server until they happen to notice. `--volumes` matters
      # just as much: the next run needs a database with no administrator in it
      # yet. Scoped to this project by name — nothing else on the machine is
      # touched.
      - name: Take the stack down
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker image rm --force culina:ci || true

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # CodeQL reads the run it is part of. Without this the analyze step 403s
      # on the workflow-runs API and the job ends as a configuration error,
      # having found nothing.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0

      - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      # Same reason as the CodeQL job: uploading a SARIF reads the run it came
      # from, and a token without this gets a 403 rather than a report.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks reads history, and a shallow clone would leave a secret
          # committed three days ago unfound.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: src/backend/**/packages.lock.json

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      # NuGetAudit already fails the compile on a vulnerable package. This
      # prints which one, so the failure is actionable without a local build.
      - name: Vulnerable NuGet packages
        working-directory: src/backend
        run: |
          dotnet restore --locked-mode
          report=$(dotnet list package --vulnerable --include-transitive)
          echo "$report"
          if echo "$report" | grep -q '> '; then
            echo "::error::A dependency has a known vulnerability."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      - run: pnpm audit --audit-level=high
        working-directory: src/frontend

      - name: Build the image to scan
        run: docker build -t culina:scan --build-arg REVISION="${GITHUB_SHA::7}" .

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: culina:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          # Only what can actually be acted on. A finding with no fix available
          # is a finding that teaches everyone to ignore the report.
          ignore-unfixed: true
          # Named rather than left to the default lookup, so the file is
          # discoverable from here. Every entry in it carries an expiry date.
          trivyignores: .trivyignore
          exit-code: '1'

      - uses: github/codeql-action/upload-sarif@977e6ceaea7361825998245d787fa3b4d6b9e5df # codeql-bundle-v2.27.0
        # Uploaded even when Trivy failed, which is when it is worth reading.
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Every gate above, without exception. An image published from a commit
    # whose tests were still running is an image nobody can reason about, and
    # `edge` is a tag people actually deploy.
    needs: [backend, frontend, contract, e2e, codeql, security]
    # Only a real push to this repository's main. A pull request — including
    # one from a fork — must never reach the registry, and on a fork the
    # token could not write to it anyway.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write # the image
      id-token: write # keyless signing, and provenance
      attestations: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR rejects an uppercase path, and `github.repository` preserves
      # whatever case the repository was named with. Cheaper to fold it than
      # to discover it on the first push.
      - id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Same as a release: arm64 is not optional when a large share of
      # self-hosted instances are a Raspberry Pi.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          # `edge` is what a main build is called, and it deliberately is not
          # `latest`: `latest` belongs to a tagged release and must never move
          # because somebody merged. `sha-` is the one that pins — it is how a
          # deployment rolls back to a specific commit.
          tags: |
            type=raw,value=edge
            type=sha,format=long
            type=raw,value=main

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REVISION=${{ github.sha }}
            VERSION=0.0.0-edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Signed for the same reason a release is: so the thing running in a
      # kitchen can be traced to this repository and this commit without
      # trusting the registry it came from.
      - name: Sign the image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: What was published
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "docker pull ${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Tags: \`edge\`, \`main\`, \`sha-${GITHUB_SHA}\` — linux/amd64 and linux/arm64."
          } >> "$GITHUB_STEP_SUMMARY"
