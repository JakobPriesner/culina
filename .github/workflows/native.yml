# The installed apps (docs/native-app-design.md, 5.4). Not in ci.yml on purpose:
# every job there gates publishing the server image, and self-hosters must not
# wait on an Android lint. A red run here still blocks a pull request, through
# branch protection if it is made required.
#
# Actions are pinned to a commit, as in ci.yml.

name: Native

on:
  pull_request:
    paths: ['src/frontend/**', '.github/workflows/native.yml']
  push:
    branches: [main]
    paths: ['src/frontend/**', '.github/workflows/native.yml']
  schedule:
    # Nightly, after ci.yml's own nightly, for the emulator smoke test.
    - cron: '43 4 * * *'
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_PACKAGE_JSON: 'src/frontend/package.json'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      # The app's bundle into the Gradle project; the runner has the Android SDK.
      - run: pnpm build:native && pnpm exec cap sync android
        working-directory: src/frontend

      - run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug
        working-directory: src/frontend/native/android

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug
          path: src/frontend/native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ env.PNPM_PACKAGE_JSON }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: src/frontend

      - run: pnpm build:native && pnpm exec cap sync ios
        working-directory: src/frontend

      # The app, its CulinaTimers plugin and the CulinaTimerWidget extension, unsigned, for the simulator: proves
      # the Swift compiles against the runner's SDK and the project links.
      - name: Build
        working-directory: src/frontend/native/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO build

  # Nightly and by hand: the real app on an emulator against the real server image, through Maestro.
  android-smoke:
    name: Android smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      COMPOSE_PROJECT_NAME: culina-native
      CULINA_PORT: '8080'
      Database__Password: "the app's own password"
      POSTGRES_SUPERUSER_PASSWORD: culina_ci_superuser_password
      MAESTRO_VERSION: cli-2.11.0
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-debug

      # The same stack as ci.yml's end-to-end job: the real image, a real database, the first account.
      - name: Start the stack
        env:
          RateLimits__LoginPerIpPerMinute: '1000'
          ForwardedHeaders__KnownNetworks: 172.16.0.0/12
        run: |
          docker build -t culina:native --build-arg REVISION="${GITHUB_SHA::7}" .
          CULINA_IMAGE=culina:native docker compose up -d --wait
          scripts/setup-database.sh "http://localhost:${CULINA_PORT}"
          curl --fail --silent --show-error \
            -X POST "http://localhost:${CULINA_PORT}/api/v1/users" \
            -H 'Content-Type: application/json' \
            -H "Origin: http://localhost:${CULINA_PORT}" \
            -d '{"email":"ci@culina.test","displayName":"CI","password":"a sentence nobody else would pick"}'

      # Pinned and checked, as an action is: the install script would fetch whatever is newest.
      - name: Maestro
        run: |
          curl --fail --silent --show-error --location -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Allow the emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 10.0.2.2 is the runner as the emulator sees it: a private address, so the app allows plain http to it.
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r app-debug.apk
            maestro test src/frontend/native/maestro --env SERVER=http://10.0.2.2:8080

      - name: What the container said
        if: failure()
        run: docker compose logs --no-color
