# Production, layered over compose.yaml:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# What this file changes is what must not be true in production — the database
# is no longer reachable from the host, and the app runs from the published
# image rather than from a shell on somebody's laptop.
#
# TLS terminates at the operator's own reverse proxy. Culina sets no HSTS,
# performs no HTTPS redirect and compresses no response it generates:
# compressing a cookie-authenticated response invites BREACH. Static files are
# compressed at build time instead, and served as they are.

services:
  db:
    # Replaces the development mapping rather than adding to it: the database
    # is reachable only on the internal network. A published PostgreSQL port is
    # how a self-hosted instance ends up in somebody's botnet.
    ports: !override []
    environment:
      # The role the first start creates for the app, whose password is then
      # entered on the setup screen. Required here, so a production database
      # never starts with the development password.
      CULINA_APP_PASSWORD: ${Database__Password:?set Database__Password in .env}

  app:
    image: ${CULINA_IMAGE:-ghcr.io/jakobpriesner/culina:latest}
    restart: unless-stopped
    depends_on:
      db:
        # Not `started`. A migration that runs against a database still
        # starting up fails the boot, and the container restarts into the same
        # race.
        condition: service_healthy
    environment:
      Database__Host: db
      Database__Port: '5432'
      Database__Name: ${POSTGRES_DB:-culina}
      # Where the database is, which this file decides — but not how to sign
      # in to it. A variable set here wins over the app, so the setup screen
      # could only show the role, the password and TLS, never change them. The
      # first visit asks for them instead: the role and password the db service
      # created from .env, and TLS off, which this network's database does not
      # speak and no other container joins.
      # ── Everything below is also under Settings → Server. ─────────────────
      # An administrator can change these from the app, which saves them to
      # /data/config and restarts itself. Each is passed through only if you
      # set it in .env — and a value set here wins over the app and shows there
      # as fixed by the environment, which is also how you undo a setting that
      # locked everybody out. An empty value counts as unset.
      #
      # Secure cookies default to on: the proxy in front of this terminates
      # TLS, so the cookie must be marked Secure even though this process
      # speaks plain HTTP to it.
      Cookies__Secure: ${Cookies__Secure:-}
      # One of these is required, and required to be specific: trusting every
      # proxy lets any client forge its own address, which makes per-IP rate
      # limiting useless and every security log line a guess.
      #
      # A proxy in this compose network has no address anyone can know in
      # advance, so name the network instead — `docker network inspect` gives
      # you its subnet, and the settings screen shows the address it sees. Keep
      # it as small as it can be.
      ForwardedHeaders__KnownProxies: ${ForwardedHeaders__KnownProxies:-}
      ForwardedHeaders__KnownNetworks: ${ForwardedHeaders__KnownNetworks:-}
      # At their defaults unless somebody says otherwise. The end-to-end suite
      # raises them, because every request in it comes from one address and
      # the defaults are right to refuse that.
      RateLimits__LoginPerIpPerMinute: ${RateLimits__LoginPerIpPerMinute:-}
      RateLimits__RegisterPerIpPerHour: ${RateLimits__RegisterPerIpPerHour:-}
      RateLimits__RequestsPerSessionPerMinute: ${RateLimits__RequestsPerSessionPerMinute:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-culina-api}
    ports:
      - '${CULINA_PORT:-8080}:8080'
    volumes:
      # ── All three of these are mandatory. ───────────────────────────────────
      # Recipe photographs. Not in the database and not rebuildable: without
      # this volume every photo in the instance is gone on the next deploy, and
      # nothing will have said so.
      - culina-images:/data/images
      # The data-protection key ring. Culina's session cookie carries an opaque
      # reference rather than an encrypted payload, so a lost key ring does not
      # sign anyone out — but anything the framework protects later would
      # change key on every restart.
      - culina-keys:/data/keys
      # What an administrator changed under Settings → Server, as culina.json.
      # Without it the settings screen can show those settings but not save
      # them, and says so.
      - culina-config:/data/config
    # Nothing but the three volumes is writable, and /tmp is memory that does
    # not survive the container.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # The image's own check, stated here too so `docker compose ps` and any
      # orchestrator agree on what healthy means.
      test: ['CMD', '/app/Api', '--health-check']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  culina-images:
  culina-keys:
  culina-config:
