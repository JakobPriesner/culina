# The app's first launch against a real server (.github/workflows/native.yml, android-smoke): connect, check the server,
# sign in for a bearer token, and land where a new account lands. Every step crosses the parts no browser test can:
# the app's origin, CORS, the token in the Keystore, the connect screen.
appId: app.culina
env:
  SERVER: http://10.0.2.2:8080
  EMAIL: ci@culina.test
  PASSWORD: a sentence nobody else would pick
---
- launchApp:
    clearState: true
- assertVisible: 'Connect to your kitchen'
- tapOn: 'Server address'
- inputText: ${SERVER}
- tapOn: 'Connect'
- assertVisible: 'Sign in'
- tapOn: 'Email address'
- inputText: ${EMAIL}
- tapOn: 'Password'
- inputText: ${PASSWORD}
- tapOn:
    text: 'Sign in'
    index: 1
# A new account has no household yet: the app read /users/me from the server with its token.
- assertVisible: 'You are not in a household yet'
# Relaunch: the server and the token were remembered, so no connect screen and no sign-in.
- stopApp
- launchApp
- assertVisible: 'You are not in a household yet'
