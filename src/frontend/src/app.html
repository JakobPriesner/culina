<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Stamps the stored appearance before the first paint. Inline and
      synchronous on purpose: anything deferred, imported or loaded from a file
      paints the default theme first, and a white flash on the way into a dark
      kitchen is the one bug every user notices.

      __CULINA_NONCE__ is replaced per response by the backend, because the
      Content-Security-Policy names a fresh nonce each time and this script must
      match it. It stays literal under the dev server, which sets no policy.
    -->
    <script nonce="__CULINA_NONCE__">
      (function () {
        var root = document.documentElement;
        var theme = 'warm-paper';
        var mode = 'system';

        try {
          var stored = JSON.parse(localStorage.getItem('culina.appearance') || '{}');

          if (typeof stored.theme === 'string') theme = stored.theme;
          if (typeof stored.mode === 'string') mode = stored.mode;
        } catch (ignored) {
          // A blocked or corrupt store is not a reason to fail to render.
        }

        root.dataset.theme = theme;
        root.dataset.mode =
          mode === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : mode;
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!--
      Painted before a single byte of JavaScript has run, and removed by the
      root layout once the app is mounted. The app cannot know whether this is a
      signed-in person until it has asked the server, and a white rectangle for
      that half second is the worst thing a self-hosted app can open with.

      Styled inline because the stylesheet is itself a request.
    -->
    <div
      id="boot"
      style="
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--surface, #fdfbf7);
        color: var(--text-muted, #6b5943);
        font:
          500 0.875rem/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
      "
    >
      <span>Culina</span>
    </div>

    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
